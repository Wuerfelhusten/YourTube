org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# In-app updater: GitHub repository (owner/name) whose latest release APK YourTube offers as update.
# Empty = updater off.
yourtube.updateRepo=Wuerfelhusten/YourTube

# App version (MAJOR.MINOR.PATCH). A release is published by pushing the tag v<this version>;
# the release workflow fails if tag and version differ. versionCode is derived from it.
yourtube.versionName=0.2.2
